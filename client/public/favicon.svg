<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050810"/>
      <stop offset="100%" style="stop-color:#0a0f1e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  
  <!-- Node circles -->
  <circle cx="16" cy="8" r="3.5" fill="none" stroke="url(#glow)" stroke-width="1.5" filter="url(#blur)"/>
  <circle cx="8" cy="20" r="3.5" fill="none" stroke="#00d4ff" stroke-width="1.5" filter="url(#blur)"/>
  <circle cx="24" cy="20" r="3.5" fill="none" stroke="#7c3aed" stroke-width="1.5" filter="url(#blur)"/>
  
  <!-- Edges -->
  <line x1="16" y1="11.5" x2="8" y2="16.5" stroke="rgba(0,212,255,0.5)" stroke-width="1.2" stroke-dasharray="2,1.5"/>
  <line x1="16" y1="11.5" x2="24" y2="16.5" stroke="rgba(124,58,237,0.5)" stroke-width="1.2" stroke-dasharray="2,1.5"/>
  <line x1="8" y1="23.5" x2="24" y2="23.5" stroke="rgba(0,255,159,0.4)" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Array at bottom -->
  <rect x="5" y="27" width="22" height="3" rx="1.5" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.4)" stroke-width="0.8"/>
  <rect x="7" y="27.5" width="4" height="2" rx="0.7" fill="rgba(0,212,255,0.3)"/>
  <rect x="13" y="27.5" width="4" height="2" rx="0.7" fill="rgba(124,58,237,0.3)"/>
  <rect x="19" y="27.5" width="4" height="2" rx="0.7" fill="rgba(0,255,159,0.3)"/>
  
  <!-- Zap/lightning in center nodes -->
  <text x="16" y="9.2" text-anchor="middle" font-size="4" fill="#00d4ff" font-weight="bold">⚡</text>
</svg>
